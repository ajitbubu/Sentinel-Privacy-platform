name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - apps/pmp-portal/pmp-backend
          - apps/idp-console/idp-backend
          - apps/api/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: pip install -r requirements.txt && pip install pytest pytest-cov ruff
      - name: Lint
        working-directory: ${{ matrix.app }}
        run: ruff check src/
      - name: Test
        working-directory: ${{ matrix.app }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/ -v || true   # remove '|| true' once tests exist

  frontend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - apps/pmp-portal/pmp-frontend
          - apps/idp-console/idp-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & Build
        working-directory: ${{ matrix.app }}
        run: npm install && npm run build
