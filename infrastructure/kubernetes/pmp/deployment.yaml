apiVersion: apps/v1
kind: Deployment
metadata:
  name: pmp-backend
  namespace: consent-platform
spec:
  replicas: 2
  selector:
    matchLabels: { app: pmp-backend }
  template:
    metadata:
      labels: { app: pmp-backend }
    spec:
      containers:
        - name: pmp-backend
          image: your-registry/pmp-backend:latest
          ports: [{ containerPort: 8001 }]
          envFrom:
            - secretRef: { name: platform-secrets }
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 8001 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: pmp-backend
  namespace: consent-platform
spec:
  selector: { app: pmp-backend }
  ports: [{ port: 8001, targetPort: 8001 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pmp-backend
  namespace: consent-platform
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: pmp-backend }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
