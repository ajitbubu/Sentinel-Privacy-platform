groups:
  - name: consent-platform
    rules:
      - alert: SyncLatencyBreach
        expr: histogram_quantile(0.99, rate(sync_latency_seconds_bucket[5m])) > 1
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Sync latency P99 above 1 second (SLO breach)"
      - alert: WebhookFailureRate
        expr: rate(webhook_deliveries_failed_total[15m]) / rate(webhook_deliveries_total[15m]) > 0.03
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Webhook success rate below 97%"
      - alert: APIHighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 0.3
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "API P95 latency above 300ms"
