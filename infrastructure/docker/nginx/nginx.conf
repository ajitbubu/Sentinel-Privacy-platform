events { worker_connections 1024; }

http {
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

  upstream pmp_backend { server pmp-backend:8001; }
  upstream idp_backend { server idp-backend:8002; }
  upstream external_api { server external-api:8003; }

  # PMP Portal (Internet-facing)
  server {
    listen 80;
    server_name pmp.localhost;
    limit_req zone=api_limit burst=200 nodelay;

    location /api/ { proxy_pass http://pmp_backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /ws/  { proxy_pass http://pmp_backend; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  }

  # IDP Console (Intranet only - restrict by IP in production)
  server {
    listen 80;
    server_name idp.localhost;
    # allow 10.0.0.0/8; deny all;   # uncomment for intranet-only

    location /api/ { proxy_pass http://idp_backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  }

  # External API (partner-facing)
  server {
    listen 80;
    server_name api.localhost;
    limit_req zone=api_limit burst=100 nodelay;

    location /api/ { proxy_pass http://external_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  }
}
