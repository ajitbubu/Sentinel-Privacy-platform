services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: consent_db
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../database/schemas/postgresql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes:
      - es_data:/usr/share/elasticsearch/data

  pmp-backend:
    build: ../../apps/pmp-portal/pmp-backend
    ports: ["8001:8001"]
    environment:
      DATABASE_URL: postgresql://admin:password@postgres:5432/consent_db
      REDIS_URL: redis://redis:6379/0
      MONGO_URL: mongodb://admin:password@mongodb:27017/consent_db
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  idp-backend:
    build: ../../apps/idp-console/idp-backend
    ports: ["8002:8002"]
    environment:
      DATABASE_URL: postgresql://admin:password@postgres:5432/consent_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  external-api:
    build: ../../apps/api/backend
    ports: ["8003:8003"]
    environment:
      DATABASE_URL: postgresql://admin:password@postgres:5432/consent_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - pmp-backend
      - idp-backend
      - external-api

volumes:
  postgres_data:
  mongo_data:
  es_data:
