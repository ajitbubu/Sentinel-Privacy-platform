# Local development stack. Run from the repo root:
#     docker compose up -d
#
# Postgres auto-applies database/schemas/postgresql/*.sql on first boot, then
# the seed file (mounted as 900_ so it sorts after every schema migration).
# To re-run them from scratch:  docker compose down -v && docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: consent_db
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Single directory mount. Do NOT nest a file mount inside this one —
      # Docker creates the mount point as an empty file in the source tree,
      # which silently shadows the real data. Reference data is 008_ instead.
      - ./database/schemas/postgresql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d consent_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: sentinel-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db

  pmp-backend:
    build: ./apps/pmp-portal/pmp-backend
    container_name: sentinel-pmp-api
    ports: ["8001:8001"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://admin:password@postgres:5432/consent_db
      REDIS_URL: redis://redis:6379/0
      MONGO_URL: mongodb://admin:password@mongodb:27017/consent_db
      SECRET_KEY: dev-only-change-me-in-every-real-environment
      PMP_FRONTEND_URL: http://localhost:3001
      CORS_ORIGINS: '["http://localhost:3001"]'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  idp-backend:
    build: ./apps/idp-console/idp-backend
    container_name: sentinel-idp-api
    ports: ["8002:8002"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://admin:password@postgres:5432/consent_db
      REDIS_URL: redis://redis:6379/0
      MONGO_URL: mongodb://admin:password@mongodb:27017/consent_db
      SECRET_KEY: dev-only-change-me-in-every-real-environment
      CORS_ORIGINS: '["http://localhost:3002"]'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  external-api:
    build: ./apps/api/backend
    container_name: sentinel-external-api
    ports: ["8003:8003"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://admin:password@postgres:5432/consent_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  postgres_data:
  mongo_data:
